<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PrivAI: Secure Video Call</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>PrivAI Secure Session</h1>
            <p>Adaptive Privacy Filter Active</p>
        </header>

        <div class="video-grid">
            <div class="video-container local-video-container">
                <video id="localVideo" class="video-feed" autoplay playsinline muted></video>
                <div class="video-label">You (Filtered)</div>
            </div>
            <div class="video-container remote-video-container">
                <video id="remoteVideo" class="video-feed" autoplay playsinline></video>
                <div class="video-label">Remote User</div>
            </div>
        </div>

        <div class="controls-panel">
            <div class="select-container">
                <select id="cameraSelect" class="device-select">
                    <option value="" disabled selected>Loading cameras...</option>
                </select>
            </div>

            <div class="media-controls">
                <button id="toggleMicBtn" class="control-btn" onclick="toggleMic()">
                    <i class="fas fa-microphone"></i>
                </button>
                <button id="toggleCamBtn" class="control-btn" onclick="toggleCam()">
                    <i class="fas fa-video"></i>
                </button>
                <button id="startCall" class="call-button">
                    Start Call 📞
                </button>
            </div>

            <div id="statusMessage" class="status-message">Select your Virtual Camera to begin...</div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
